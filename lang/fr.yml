fr:
  'Kalakotra\EFormKinderzuschlag\Forms\Form_Step1':
    'DEFAULT_SELECT': 'Veuillez sélectionner'
    'Answer.no': 'Non'
    'Answer.yes': 'Oui'
    'IntroText': 'Demande de supplément pour enfants (Kinderzuschlag)'
    'GeneralNotice': 'Le supplément pour enfants est versé aux parents qui gagnent assez pour eux-mêmes, mais dont les revenus ne suffisent pas ou à peine pour toute la famille. Il est accordé pour six mois à compter du mois de la demande. Le demandeur est le parent qui perçoit les allocations familiales (Kindergeld).'
    'ApplicationType': 'Quelle demande souhaitez-vous déposer ?'
    'ApplicationType.full': 'Demande de supplément pour enfants (demande complète avec annexes)'
    'ApplicationType.short': 'Demande simplifiée en cas de situation inchangée (reconduction, Kurzantrag)'
    'ShortNotice': 'Vous ne pouvez utiliser la demande simplifiée que si vous percevez déjà le supplément pour enfants et pouvez répondre « Non » à chacune des questions suivantes. Au cours des 6 derniers mois, ma situation a changé de manière significative parce que …'
    'ShortChangedHousehold': '… la taille de ma famille (Bedarfsgemeinschaft) a changé'
    'ShortChangedAssets': '… le patrimoine a changé de sorte qu''un patrimoine important existe désormais ou n''existe plus'
    'ShortChangedIncome': '… le revenu net total de ma famille (parents et enfants, y compris p. ex. allocation chômage ou indemnités de maladie) a augmenté ou diminué de plus de 15 %'
    'ShortChangedHousing': '… les frais de logement de ma famille ont augmenté ou diminué de plus de 15 %'
    'ShortLastWasShort': 'Votre dernière demande de supplément pour enfants était-elle une demande simplifiée ?'
    'KindergeldNumber': 'Numéro d''allocations familiales (Kindergeldnummer, facultatif)'
    'KindergeldNumberDescription': 'Trois chiffres, les lettres FK et six chiffres, p. ex. 123FK456789 (voir la décision d''allocations familiales).'
    'SecondApplicantKGNumber': 'Numéro d''allocations familiales de la deuxième personne demandeuse (facultatif)'
    'SecondApplicantKGNumberDescription': 'Uniquement si les allocations familiales sont versées en partie à vous et en partie à votre partenaire. Votre partenaire signe alors en plus personnellement la demande.'
    'ShortNotAllowed': 'Avec cette réponse, une demande simplifiée n''est pas possible. Veuillez choisir la demande complète.'
