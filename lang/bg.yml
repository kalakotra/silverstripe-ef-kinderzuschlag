    'DEFAULT_SELECT': 'Моля, изберете'
    'Answer.no': 'Не'
    'Answer.yes': 'Да'
    'IntroText': 'Заявление за добавка за деца (Kinderzuschlag)'
    'GeneralNotice': 'Добавката за деца се полага на родители, които печелят достатъчно за себе си, но чийто доход не стига или едва стига за цялото семейство. Тя се отпуска за шест месеца, считано от месеца на подаване на заявлението. Заявител е родителят, който получава детски надбавки (Kindergeld).'
    'ApplicationType': 'Какво заявление искате да подадете?'
    'ApplicationType.full': 'Заявление за добавка за деца (пълно заявление с приложения)'
    'ApplicationType.short': 'Кратко заявление при непроменени обстоятелства (продължение, Kurzantrag)'
    'ShortNotice': 'Можете да използвате краткото заявление само ако вече получавате добавка за деца и можете да отговорите с «Не» на всеки от следващите въпроси. През последните 6 месеца обстоятелствата ми се промениха съществено, защото …'
    'ShortChangedHousehold': '… се промени размерът на семейството ми (Bedarfsgemeinschaft)'
    'ShortChangedAssets': '… имуществото се промени така, че сега има или вече няма значително имущество'
    'ShortChangedIncome': '… общият нетен доход на семейството ми (родители и деца, включително напр. обезщетение за безработица или болест) се увеличи или намали с над 15 %'
    'ShortChangedHousing': '… разходите за жилище на семейството ми се увеличиха или намалиха с над 15 %'
    'ShortLastWasShort': 'Последното ви заявление за добавка за деца кратко заявление ли беше?'
    'KindergeldNumber': 'Номер на детските надбавки (Kindergeldnummer, по избор)'
    'KindergeldNumberDescription': 'Три цифри, буквите FK и шест цифри, напр. 123FK456789 (вж. решението за детските надбавки).'
    'SecondApplicantKGNumber': 'Номер на детските надбавки на втория заявител (по избор)'
    'SecondApplicantKGNumberDescription': 'Само ако детските надбавки се изплащат частично на вас и частично на вашия партньор/партньорка. В този случай партньорът също подписва лично заявлението.'
    'ShortNotAllowed': 'С този отговор не е възможно кратко заявление. Изберете пълното заявление.'
