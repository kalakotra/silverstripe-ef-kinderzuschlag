es:
  'Kalakotra\EFormKinderzuschlag\Forms\Form_Step1':
    'DEFAULT_SELECT': 'Seleccione'
    'Answer.no': 'No'
    'Answer.yes': 'Sí'
    'IntroText': 'Solicitud del suplemento por hijos (Kinderzuschlag)'
    'GeneralNotice': 'El suplemento por hijos lo reciben los padres que ganan lo suficiente para sí mismos, pero cuyos ingresos no alcanzan o apenas alcanzan para toda la familia. Se concede por seis meses a partir del mes de la solicitud. Solicitante es el progenitor que percibe la prestación por hijos (Kindergeld).'
    'ApplicationType': '¿Qué solicitud desea presentar?'
    'ApplicationType.full': 'Solicitud del suplemento por hijos (solicitud completa con anexos)'
    'ApplicationType.short': 'Solicitud abreviada con circunstancias sin cambios (continuación del pago, Kurzantrag)'
    'ShortNotice': 'Solo puede usar la solicitud abreviada si ya percibe el suplemento por hijos y puede responder «No» a cada una de las siguientes preguntas. En los últimos 6 meses mis circunstancias han cambiado sustancialmente porque …'
    'ShortChangedHousehold': '… ha cambiado el tamaño de mi familia (Bedarfsgemeinschaft)'
    'ShortChangedAssets': '… el patrimonio ha cambiado de modo que ahora existe o ya no existe un patrimonio considerable'
    'ShortChangedIncome': '… los ingresos netos totales de mi familia (padres e hijos, incluidos p. ej. prestación por desempleo o por enfermedad) han aumentado o disminuido más de un 15 %'
    'ShortChangedHousing': '… los gastos de vivienda de mi familia han aumentado o disminuido más de un 15 %'
    'ShortLastWasShort': '¿Fue su última solicitud del suplemento por hijos una solicitud abreviada?'
    'KindergeldNumber': 'Número de la prestación por hijos (Kindergeldnummer, opcional)'
    'KindergeldNumberDescription': 'Tres cifras, las letras FK y seis cifras, p. ej. 123FK456789 (véase la resolución de la prestación por hijos).'
    'SecondApplicantKGNumber': 'Número de la prestación por hijos de la segunda persona solicitante (opcional)'
    'SecondApplicantKGNumberDescription': 'Solo si la prestación por hijos se paga en parte a usted y en parte a su pareja. En ese caso su pareja firma además personalmente la solicitud.'
    'ShortNotAllowed': 'Con esta respuesta no es posible una solicitud abreviada. Elija la solicitud completa.'
