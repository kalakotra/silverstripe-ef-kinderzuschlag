    'ChildrenNotice': 'El suplemento por hijos se concede por sus propios hijos (biológicos o adoptados) y los de su pareja que tengan menos de 25 años, estén solteros, vivan en su hogar y por los que usted o su pareja perciban la prestación por hijos. Para cada uno de estos hijos se crea un «Anexo Hijo» (Anlage Kind).'
