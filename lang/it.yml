it:
  'Kalakotra\EFormKinderzuschlag\Forms\Form_Step1':
    'DEFAULT_SELECT': 'Si prega di selezionare'
    'Answer.no': 'No'
    'Answer.yes': 'Sì'
    'IntroText': 'Domanda di supplemento per figli (Kinderzuschlag)'
    'GeneralNotice': 'Il supplemento per figli spetta ai genitori che guadagnano abbastanza per sé stessi, ma il cui reddito non basta o basta appena per tutta la famiglia. Viene concesso per sei mesi a partire dal mese della domanda. Richiedente è il genitore che percepisce l''assegno per figli (Kindergeld).'
    'ApplicationType': 'Quale domanda desidera presentare?'
    'ApplicationType.full': 'Domanda di supplemento per figli (domanda completa con allegati)'
    'ApplicationType.short': 'Domanda abbreviata in caso di situazione invariata (proseguimento, Kurzantrag)'
    'ShortNotice': 'Può utilizzare la domanda abbreviata solo se percepisce già il supplemento per figli e può rispondere «No» a ciascuna delle seguenti domande. Negli ultimi 6 mesi la mia situazione è cambiata in modo rilevante perché …'
    'ShortChangedHousehold': '… è cambiata la dimensione della mia famiglia (Bedarfsgemeinschaft)'
    'ShortChangedAssets': '… il patrimonio è cambiato in modo tale che ora esiste o non esiste più un patrimonio considerevole'
    'ShortChangedIncome': '… il reddito netto complessivo della mia famiglia (genitori e figli, compresi ad es. indennità di disoccupazione o di malattia) è aumentato o diminuito di oltre il 15 %'
    'ShortChangedHousing': '… le spese abitative della mia famiglia sono aumentate o diminuite di oltre il 15 %'
    'ShortLastWasShort': 'La Sua ultima domanda di supplemento per figli era una domanda abbreviata?'
    'KindergeldNumber': 'Numero dell''assegno per figli (Kindergeldnummer, facoltativo)'
    'KindergeldNumberDescription': 'Tre cifre, le lettere FK e sei cifre, ad es. 123FK456789 (vedi decisione sull''assegno per figli).'
    'SecondApplicantKGNumber': 'Numero dell''assegno per figli del secondo richiedente (facoltativo)'
    'SecondApplicantKGNumberDescription': 'Solo se l''assegno per figli viene versato in parte a Lei e in parte al Suo partner/alla Sua partner. In tal caso il partner firma anche personalmente la domanda.'
    'ShortNotAllowed': 'Con questa risposta non è possibile una domanda abbreviata. Scelga la domanda completa.'
