en:
  'Kalakotra\EFormKinderzuschlag\Forms\Form_Step1':
    'DEFAULT_SELECT': 'Please select'
    'Answer.no': 'No'
    'Answer.yes': 'Yes'
    'IntroText': 'Application for child supplement (Kinderzuschlag)'
    'GeneralNotice': 'Parents receive the child supplement if they earn enough for themselves, but their income is not or only just enough for the whole family. It is granted for six months from the month of application. The applicant is the parent who receives the child benefit (Kindergeld).'
    'ApplicationType': 'Which application would you like to submit?'
    'ApplicationType.full': 'Application for child supplement (full application with annexes)'
    'ApplicationType.short': 'Short application if circumstances are unchanged (continued payment, Kurzantrag)'
    'ShortNotice': 'You can only use the short application if you already receive child supplement and can answer every one of the following questions with "No". In the last 6 months my circumstances have changed significantly because …'
    'ShortChangedHousehold': '… the size of my family (Bedarfsgemeinschaft) has changed'
    'ShortChangedAssets': '… my assets have changed so that significant assets now exist or no longer exist'
    'ShortChangedIncome': '… the total net income of my family (parents and children, including e.g. unemployment benefit or sickness benefit) has increased or decreased by more than 15 %'
    'ShortChangedHousing': '… my family''s housing costs have increased or decreased by more than 15 %'
    'ShortLastWasShort': 'Was your last application for child supplement a short application?'
    'KindergeldNumber': 'Child benefit number (optional)'
    'KindergeldNumberDescription': 'Three digits, the letters FK and six digits, e.g. 123FK456789 (see the child benefit notice).'
    'SecondApplicantKGNumber': 'Child benefit number of the second applicant (optional)'
    'SecondApplicantKGNumberDescription': 'Only if the child benefit for the children is paid partly to you and partly to your partner. Your partner then also signs the application personally.'
    'ShortNotAllowed': 'A short application is not possible with this answer. Please choose the full application.'
