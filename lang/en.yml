    'NeedPregnancy': 'Pregnancy'
    'DueDate': 'Expected date of delivery'
    'NeedNutrition': 'Costly diet (the "Annex on additional needs for a costly diet" KiZ 7 is attached; item 3 is completed by the doctor)'
    'NutritionConsent': 'Release from medical confidentiality: for my child I release the issuing doctor from medical confidentiality (voluntary, only for the certified illness). An adult child signs personally.'
    'NeedOther': 'Other additional need (e.g. severe disability with the mark "G" combined with full reduction in earning capacity, benefits for participation in working life)'
    'NeedNotice': 'An additional need does not increase the child supplement, but it can mean that less income is taken into account.'
