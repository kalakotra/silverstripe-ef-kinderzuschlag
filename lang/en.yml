    'AbsenceReason': 'Reason and duration of absence'
    'AbsenceReasonDescription': 'For stays with the other parent it is enough to state whether the child regularly stays there 1-12 or 13-17 days.'
    'SituationHeader': 'My child … (tick what applies, please enclose current evidence)'
    'Married': 'is married'
    'HasOwnChild': 'has a child of their own'
