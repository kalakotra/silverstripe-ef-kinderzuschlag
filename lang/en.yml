    'IntroText': 'Bank details and children'
    'IBAN': 'IBAN'
    'IBANDescription': 'The account to which child benefit and child supplement are to be paid.'
    'BIC': 'BIC (optional)'
    'AccountHolder': 'Account holder'
    'ChildrenNotice': 'Child supplement is paid for your own (biological or adopted) children and those of your partner who are under 25 and unmarried, live in your household and for whom you or your partner receive child benefit. An "Annex Child" (Anlage Kind) is created for each of these children.'
    'ChildCount': 'For how many children are you applying for child supplement?'
    'DEFAULT_SELECT': 'Please select'
    'IBANInvalid': 'Please check the IBAN.'
