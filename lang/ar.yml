  'Kalakotra\EFormKinderzuschlag\Forms\Form_Step1':
    'DEFAULT_SELECT': 'يرجى الاختيار'
    'Answer.no': 'لا'
    'Answer.yes': 'نعم'
    'IntroText': 'طلب الحصول على العلاوة الإضافية للأطفال (Kinderzuschlag)'
    'GeneralNotice': 'تُمنح العلاوة الإضافية للأطفال للوالدين اللذين يكسبان ما يكفي لنفسيهما، لكن دخلهما لا يكفي أو يكاد يكفي للأسرة بأكملها. وتُمنح لمدة ستة أشهر اعتبارًا من شهر تقديم الطلب. مقدم الطلب هو الوالد الذي يتقاضى إعانة الأطفال (Kindergeld).'
    'ApplicationType': 'ما الطلب الذي تريد تقديمه؟'
    'ApplicationType.full': 'طلب العلاوة الإضافية للأطفال (طلب كامل مع الملاحق)'
    'ApplicationType.short': 'طلب مختصر في حال عدم تغير الظروف (طلب استمرار، Kurzantrag)'
    'ShortNotice': 'لا يمكنك استخدام الطلب المختصر إلا إذا كنت تتقاضى العلاوة الإضافية للأطفال بالفعل وتستطيع الإجابة بـ«لا» على كل سؤال من الأسئلة التالية. خلال الأشهر الـ 6 الماضية تغيرت ظروفي بشكل جوهري لأن …'
    'ShortChangedHousehold': '… تغير حجم أسرتي (Bedarfsgemeinschaft)'
    'ShortChangedAssets': '… تغيرت الثروة بحيث أصبحت هناك ثروة كبيرة أو لم تعد موجودة'
    'ShortChangedIncome': '… ارتفع أو انخفض إجمالي صافي دخل أسرتي (الوالدان والأطفال، بما في ذلك مثلًا إعانة البطالة أو المرض) بأكثر من 15 %'
    'ShortChangedHousing': '… ارتفعت أو انخفضت تكاليف السكن لأسرتي بأكثر من 15 %'
    'ShortLastWasShort': 'هل كان طلبك الأخير للعلاوة الإضافية للأطفال طلبًا مختصرًا؟'
    'KindergeldNumber': 'رقم إعانة الأطفال (Kindergeldnummer، اختياري)'
    'KindergeldNumberDescription': 'ثلاثة أرقام، والحرفان FK وستة أرقام، مثلًا 123FK456789 (انظر قرار إعانة الأطفال).'
    'SecondApplicantKGNumber': 'رقم إعانة الأطفال لمقدم الطلب الثاني (اختياري)'
    'SecondApplicantKGNumberDescription': 'فقط إذا كانت إعانة الأطفال تُدفع جزئيًا لك وجزئيًا لشريكك/شريكتك. في هذه الحالة يوقع الشريك أيضًا على الطلب شخصيًا.'
    'ShortNotAllowed': 'مع هذه الإجابة لا يمكن تقديم طلب مختصر. يرجى اختيار الطلب الكامل.'
