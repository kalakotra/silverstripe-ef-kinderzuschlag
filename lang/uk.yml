    'ApplicationType.full': 'Заява на дитячу надбавку (повна заява з додатками)'
    'ApplicationType.short': 'Коротка заява за незмінних обставин (продовження, Kurzantrag)'
    'ShortNotice': 'Коротку заяву можна використати, лише якщо ви вже отримуєте дитячу надбавку і можете відповісти «Ні» на кожне з наступних питань. За останні 6 місяців мої обставини суттєво змінилися, тому що …'
    'ShortChangedHousehold': '… змінився розмір моєї сім''ї (Bedarfsgemeinschaft)'
    'ShortChangedAssets': '… майно змінилося так, що значне майно тепер є або більше немає'
    'ShortChangedIncome': '… загальний чистий дохід моєї сім''ї (батьки та діти, включно з, наприклад, допомогою з безробіття чи хвороби) збільшився або зменшився більш ніж на 15 %'
    'ShortChangedHousing': '… витрати моєї сім''ї на житло збільшилися або зменшилися більш ніж на 15 %'
    'ShortLastWasShort': 'Ваша остання заява на дитячу надбавку була короткою заявою?'
    'KindergeldNumber': 'Номер допомоги на дітей (Kindergeldnummer, необов''язково)'
    'KindergeldNumberDescription': 'Три цифри, літери FK і шість цифр, наприклад 123FK456789 (див. рішення про допомогу на дітей).'
    'SecondApplicantKGNumber': 'Номер допомоги на дітей другого заявника (необов''язково)'
