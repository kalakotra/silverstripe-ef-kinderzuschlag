    'IntroText': 'Заява на дитячу надбавку (Kinderzuschlag)'
    'GeneralNotice': 'Дитяча надбавка належить батькам, які заробляють достатньо для себе, але чий дохід не вистачає або ледве вистачає на всю сім''ю. Вона призначається на шість місяців, починаючи з місяця подання заяви. Заявником є той з батьків, хто отримує допомогу на дітей (Kindergeld).'
