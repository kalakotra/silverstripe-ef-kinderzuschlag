    'IntroText': 'Žádost o příplatek na dítě (Kinderzuschlag)'
    'GeneralNotice': 'Příplatek na dítě dostávají rodiče, kteří vydělávají dost pro sebe, ale jejichž příjem nestačí nebo jen těsně stačí pro celou rodinu. Přiznává se na šest měsíců od měsíce podání žádosti. Žadatelem je rodič, který pobírá přídavky na děti (Kindergeld).'
    'ApplicationType': 'Jakou žádost chcete podat?'
    'ApplicationType.full': 'Žádost o příplatek na dítě (úplná žádost s přílohami)'
    'ApplicationType.short': 'Zkrácená žádost při nezměněných poměrech (pokračování výplaty, Kurzantrag)'
    'ShortNotice': 'Zkrácenou žádost můžete použít jen tehdy, pokud již příplatek na dítě pobíráte a na každou z následujících otázek můžete odpovědět „Ne“. V posledních 6 měsících se mé poměry podstatně změnily, protože …'
    'ShortChangedHousehold': '… se změnila velikost mé rodiny (Bedarfsgemeinschaft)'
    'ShortChangedAssets': '… se majetek změnil tak, že nyní existuje nebo již neexistuje značný majetek'
    'ShortChangedIncome': '… se celkový čistý příjem mé rodiny (rodiče a děti, včetně např. podpory v nezaměstnanosti nebo nemocenské) zvýšil nebo snížil o více než 15 %'
    'ShortChangedHousing': '… se náklady mé rodiny na bydlení zvýšily nebo snížily o více než 15 %'
    'ShortLastWasShort': 'Byla Vaše poslední žádost o příplatek na dítě zkrácená žádost?'
    'KindergeldNumber': 'Číslo přídavků na děti (Kindergeldnummer, nepovinné)'
    'KindergeldNumberDescription': 'Tři číslice, písmena FK a šest číslic, např. 123FK456789 (viz rozhodnutí o přídavcích na děti).'
    'SecondApplicantKGNumber': 'Číslo přídavků na děti druhého žadatele (nepovinné)'
    'SecondApplicantKGNumberDescription': 'Pouze pokud se přídavky na děti vyplácejí zčásti Vám a zčásti Vašemu partnerovi/Vaší partnerce. Váš partner/Vaše partnerka pak žádost navíc osobně podepíše.'
    'ShortNotAllowed': 'S touto odpovědí není zkrácená žádost možná. Zvolte prosím úplnou žádost.'
