    'IntroText': 'Wniosek o dodatek na dziecko (Kinderzuschlag)'
    'GeneralNotice': 'Dodatek na dziecko otrzymują rodzice, którzy zarabiają wystarczająco na siebie, ale których dochód nie wystarcza lub ledwo wystarcza na całą rodzinę. Przyznawany jest na sześć miesięcy od miesiąca złożenia wniosku. Wnioskodawcą jest rodzic, który pobiera zasiłek na dziecko (Kindergeld).'
    'ApplicationType': 'Jaki wniosek chcą Państwo złożyć?'
    'ApplicationType.full': 'Wniosek o dodatek na dziecko (pełny wniosek z załącznikami)'
    'ApplicationType.short': 'Wniosek skrócony przy niezmienionej sytuacji (kontynuacja wypłaty, Kurzantrag)'
    'ShortNotice': 'Wniosek skrócony można złożyć tylko wtedy, gdy już otrzymują Państwo dodatek na dziecko i na każde z poniższych pytań mogą Państwo odpowiedzieć „Nie”. W ostatnich 6 miesiącach moja sytuacja istotnie się zmieniła, ponieważ …'
    'ShortChangedHousehold': '… zmieniła się wielkość mojej rodziny (Bedarfsgemeinschaft)'
    'ShortChangedAssets': '… zmienił się majątek tak, że obecnie istnieje lub już nie istnieje znaczny majątek'
    'ShortChangedIncome': '… łączny dochód netto mojej rodziny (rodzice i dzieci, także np. zasiłek dla bezrobotnych lub chorobowy) wzrósł lub zmalał o ponad 15 %'
    'ShortChangedHousing': '… koszty mieszkaniowe mojej rodziny wzrosły lub zmalały o ponad 15 %'
    'ShortLastWasShort': 'Czy Państwa ostatni wniosek o dodatek na dziecko był wnioskiem skróconym?'
    'KindergeldNumber': 'Numer zasiłku na dziecko (Kindergeldnummer, opcjonalnie)'
    'KindergeldNumberDescription': 'Trzy cyfry, litery FK i sześć cyfr, np. 123FK456789 (patrz decyzja o zasiłku na dziecko).'
    'SecondApplicantKGNumber': 'Numer zasiłku na dziecko drugiego wnioskodawcy (opcjonalnie)'
    'SecondApplicantKGNumberDescription': 'Tylko jeśli zasiłek na dzieci jest wypłacany częściowo Państwu, a częściowo partnerowi/partnerce. Partner/partnerka podpisuje wtedy dodatkowo wniosek osobiście.'
    'ShortNotAllowed': 'Przy tej odpowiedzi wniosek skrócony nie jest możliwy. Prosimy wybrać pełny wniosek.'
