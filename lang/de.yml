    'ApplicationType.full': 'Antrag auf Kinderzuschlag (vollständiger Antrag mit Anlagen)'
    'ApplicationType.short': 'Kurzantrag bei unveränderten Verhältnissen (Weiterbewilligung)'
    'ShortNotice': 'Den Kurzantrag können Sie nur verwenden, wenn Sie bereits Kinderzuschlag erhalten und jede der folgenden Fragen mit „Nein“ beantworten können. In den letzten 6 Monaten haben sich meine Verhältnisse wesentlich geändert, weil …'
    'ShortChangedHousehold': '… sich die Größe meiner Familie (Bedarfsgemeinschaft) geändert hat'
    'ShortChangedAssets': '… sich die Höhe des Vermögens so verändert hat, dass erhebliches Vermögen vorliegt bzw. nicht mehr vorliegt'
    'ShortChangedIncome': '… sich das Gesamtnettoeinkommen meiner Familie (Eltern und Kinder, auch z. B. Arbeitslosengeld oder Krankengeld) um mehr als 15 % erhöht oder verringert hat'
    'ShortChangedHousing': '… sich die Wohnkosten meiner Familie um mehr als 15 % erhöht oder verringert haben'
    'ShortLastWasShort': 'War Ihr letzter Antrag auf Kinderzuschlag ein Kurzantrag?'
    'KindergeldNumber': 'Kindergeldnummer (optional)'
    'KindergeldNumberDescription': 'Drei Ziffern, die Buchstaben FK und sechs Ziffern, z. B. 123FK456789 (siehe Kindergeldbescheid).'
    'SecondApplicantKGNumber': 'Kindergeldnummer der zweiten antragstellenden Person (optional)'
    'SecondApplicantKGNumberDescription': 'Nur wenn das Kindergeld für die Kinder teils an Sie und teils an Ihre(n) Partner(in) gezahlt wird. Ihr(e) Partner(in) unterschreibt den Antrag dann zusätzlich selbst.'
    'ShortNotAllowed': 'Mit dieser Antwort ist ein Kurzantrag nicht möglich. Bitte wählen Sie den vollständigen Antrag.'
