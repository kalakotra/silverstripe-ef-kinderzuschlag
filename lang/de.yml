    'IntroText': 'Antrag auf Kinderzuschlag'
    'GeneralNotice': 'Den Kinderzuschlag erhalten Eltern, die genug für sich selbst verdienen, deren Einkommen aber nicht oder nur knapp für die ganze Familie reicht. Er wird ab dem Monat der Antragstellung für sechs Monate bewilligt. Antragsteller(in) ist der Elternteil, der das Kindergeld erhält.'
