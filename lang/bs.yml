    'IntroText': 'Zahtjev za dodatak za djecu (Kinderzuschlag)'
    'GeneralNotice': 'Dodatak za djecu dobijaju roditelji koji zarađuju dovoljno za sebe, ali čiji prihod nije dovoljan ili je jedva dovoljan za cijelu porodicu. Odobrava se na šest mjeseci od mjeseca podnošenja zahtjeva. Podnosilac zahtjeva je roditelj koji prima dječiji doplatak (Kindergeld).'
    'ApplicationType': 'Koji zahtjev želite podnijeti?'
    'ApplicationType.full': 'Zahtjev za dodatak za djecu (potpuni zahtjev s prilozima)'
    'ApplicationType.short': 'Skraćeni zahtjev pri nepromijenjenim okolnostima (nastavak isplate, Kurzantrag)'
    'ShortNotice': 'Skraćeni zahtjev možete koristiti samo ako već primate dodatak za djecu i ako na svako od sljedećih pitanja možete odgovoriti s „Ne“. U posljednjih 6 mjeseci moje okolnosti su se bitno promijenile jer …'
    'ShortChangedHousehold': '… se promijenila veličina moje porodice (Bedarfsgemeinschaft)'
    'ShortChangedAssets': '… se imovina promijenila tako da sada postoji ili više ne postoji značajna imovina'
    'ShortChangedIncome': '… se ukupni neto prihod moje porodice (roditelji i djeca, uključujući npr. naknadu za nezaposlene ili bolovanje) povećao ili smanjio za više od 15 %'
    'ShortChangedHousing': '… su se troškovi stanovanja moje porodice povećali ili smanjili za više od 15 %'
    'ShortLastWasShort': 'Je li Vaš posljednji zahtjev za dodatak za djecu bio skraćeni zahtjev?'
    'KindergeldNumber': 'Broj dječijeg doplatka (Kindergeldnummer, neobavezno)'
    'KindergeldNumberDescription': 'Tri cifre, slova FK i šest cifara, npr. 123FK456789 (vidi rješenje o dječijem doplatku).'
    'SecondApplicantKGNumber': 'Broj dječijeg doplatka druge osobe koja podnosi zahtjev (neobavezno)'
    'SecondApplicantKGNumberDescription': 'Samo ako se dječiji doplatak za djecu isplaćuje dijelom Vama, a dijelom Vašem partneru/Vašoj partnerici. Vaš partner/Vaša partnerica tada dodatno lično potpisuje zahtjev.'
    'ShortNotAllowed': 'S ovim odgovorom skraćeni zahtjev nije moguć. Molimo odaberite potpuni zahtjev.'
