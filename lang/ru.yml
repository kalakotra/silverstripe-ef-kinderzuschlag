    'IntroText': 'Заявление на детскую надбавку (Kinderzuschlag)'
    'GeneralNotice': 'Детская надбавка полагается родителям, которые зарабатывают достаточно для себя, но чей доход не хватает или едва хватает на всю семью. Она назначается на шесть месяцев начиная с месяца подачи заявления. Заявителем является родитель, получающий детское пособие (Kindergeld).'
    'ApplicationType': 'Какое заявление вы хотите подать?'
    'ApplicationType.full': 'Заявление на детскую надбавку (полное заявление с приложениями)'
    'ApplicationType.short': 'Краткое заявление при неизменных обстоятельствах (продление, Kurzantrag)'
    'ShortNotice': 'Краткое заявление можно использовать, только если вы уже получаете детскую надбавку и можете ответить «Нет» на каждый из следующих вопросов. За последние 6 месяцев мои обстоятельства существенно изменились, потому что …'
    'ShortChangedHousehold': '… изменился размер моей семьи (Bedarfsgemeinschaft)'
    'ShortChangedAssets': '… имущество изменилось так, что значительное имущество теперь имеется или больше не имеется'
    'ShortChangedIncome': '… общий чистый доход моей семьи (родители и дети, включая, например, пособие по безработице или по болезни) увеличился или уменьшился более чем на 15 %'
    'ShortChangedHousing': '… расходы моей семьи на жильё увеличились или уменьшились более чем на 15 %'
    'ShortLastWasShort': 'Ваше последнее заявление на детскую надбавку было кратким заявлением?'
    'KindergeldNumber': 'Номер детского пособия (Kindergeldnummer, необязательно)'
    'KindergeldNumberDescription': 'Три цифры, буквы FK и шесть цифр, например 123FK456789 (см. решение о детском пособии).'
    'SecondApplicantKGNumber': 'Номер детского пособия второго заявителя (необязательно)'
    'SecondApplicantKGNumberDescription': 'Только если детское пособие выплачивается частично вам и частично вашему партнёру/партнёрше. В этом случае партнёр также лично подписывает заявление.'
